[project]
name = "dspy-demos"
version = "0.1.0"
description = "DSPy, MCP and MLflow demos for the LLM-SE 2027 course"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # `dspy-ai` is a legacy shim that just re-exports `dspy`; depend on it directly.
    "dspy>=3.3.1",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    # Pinned to v1: the demos use `mcp.server.fastmcp.FastMCP`, renamed to
    # MCPServer in mcp 2.x. Bump only alongside a code migration.
    "mcp>=1.12.3,<2",
    # Used by the notebooks (previously installed ad hoc, never declared).
    "attachments>=0.25.1",
    "bm25s>=0.2.14",
    "datar[pandas]>=0.15.13",
    "datasets>=2.21.0",
    "pystemmer>=3.0.0",
    "ujson>=5.10",
    # Used by mlflow_demo1.py and radon.py.
    "matplotlib>=3.9",
    "mlflow>=2.16",
    "numpy>=2.3",
]

[tool.uv]
package = false
